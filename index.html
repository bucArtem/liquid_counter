<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class = 'nav-bar'>
        <div class = 'date-time'>
            <div class='date'>
                <img class="calendar-icon" src="fi-rs-calendar.svg">
                <p class = 'date-date'>Сьогодні</p>
            </div>
            <p class="datee">суботу, 23 серпня 2025 р.</p>
        </div>
        <div class = 'nav-items'>
            <div class = 'item'>
                <img class ='icon-item' src="fi-rs-raindrops.svg">
                <a class = 'text-item'>Трекер</a>
            </div>
            <div class = 'item'>
                <img class ='icon-item' src="fi-rs-stats.svg">
                <a class = 'text-item'>Статистика</a>
            </div>
            <div class = 'item' id="settingsBtn">
                <img class ='icon-item' src="fi-rs-settings.svg">
                <a class = 'text-item'>Налаштування</a>
            </div>
        </div>
    </div>
    <main>
        <div class="core">
            <div class="water-meter">
                <div class="circle">
                    <div class="water-level" id="waterLevel"></div>
                    <div class="water-text" id="waterText">0 мл</div>
                    <div class="water-goal" id="waterGoalText">із 2000 мл</div>
                    <div class="water-percentage">0%</div>
                </div>
                <div class = "counter">Залишилося 2000 мл</div>
            </div>
            <div class = 'water-plus'>
                <div class = 'add-water'>
                    <img src = 'fi-rs-plus-small.svg' class = 'plus'>
                    <p class = 'text-add'>Додати воду</p>
                </div>
                <div class="water-plus-items">
                    <div class = 'water-plus-item' data-amount="250">
                        <img src = 'fi-rs-raindrops.svg' class = 'drop'>
                        <p class = 'ml'>250мл</p>
                        <p class = 'glass'>Склянка</p>
                    </div>
                    <div class = 'water-plus-item' data-amount="500">
                        <img src = 'fi-rs-raindrops.svg' class = 'drop'>
                        <p class = 'ml'>500мл</p>
                        <p class = 'glass'>Пляшка</p>
                    </div>
                </div>
                <div class = 'water-plus-items'>
                    <div class = 'water-plus-item' data-amount="330">
                        <img src = 'fi-rs-raindrops.svg' class = 'drop'>
                        <p class = 'ml'>330мл</p>
                        <p class = 'glass'>Банка</p>
                    </div>
                    <div class = 'water-plus-item' data-amount="1000">
                        <img src = 'fi-rs-raindrops.svg' class = 'drop'>
                        <p class = 'ml'>1000мл</p>
                        <p class = 'glass'>Літр</p>
                    </div>
                </div>
            </div>
            <div id="weeklyStats" class="weekly-stats">
                <h2>Статистика за тиждень</h2>
                <canvas id="weeklyChart" width="400" height="200"></canvas>
            </div>
        </div>
    </main>

    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Налаштування</h2>
            <div class="form-group">
                <label for="goalInput">Моя денна норма (мл):</label>
                <input type="number" id="goalInput" placeholder="Наприклад, 2500">
            </div>
            <button id="saveGoalBtn">Зберегти</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <script src="script.js"></script>
</body>
</html>
